<linkset>
  <html:link rel="localization" href="paperlink.ftl"/>
</linkset>
<vbox id="paperlink-prefs" onload="PaperLinkPrefs.init()">
  <groupbox>
    <label><html:h2 data-l10n-id="paperlink-pref-search"/></label>
    <checkbox preference="extensions.paperlink.enabled" data-l10n-id="paperlink-pref-enabled"/>
    <label data-l10n-id="paperlink-pref-folders" control="paperlink-folders"/>
    <hbox align="center">
      <html:input id="paperlink-folders" type="text" flex="1" style="flex: 1"
                  preference="extensions.paperlink.folders"/>
      <button id="paperlink-browse" data-l10n-id="paperlink-pref-browse"
              oncommand="PaperLinkPrefs.browse('paperlink-folders', true)"/>
    </hbox>
    <description id="paperlink-default-folder" class="text-deemphasized"/>
    <hbox align="center">
      <label data-l10n-id="paperlink-pref-depth" control="paperlink-depth"/>
      <menulist id="paperlink-depth" preference="extensions.paperlink.scanDepth" native="true">
        <menupopup>
          <menuitem value="0" label="0"/>
          <menuitem value="1" label="1"/>
          <menuitem value="2" label="2"/>
          <menuitem value="3" label="3"/>
        </menupopup>
      </menulist>
    </hbox>
    <checkbox preference="extensions.paperlink.confirmProbable" data-l10n-id="paperlink-pref-confirm"/>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="paperlink-pref-found"/></label>
    <radiogroup preference="extensions.paperlink.downloadedCopyAction">
      <radio value="ask" data-l10n-id="paperlink-pref-copy-ask"/>
      <radio value="delete" data-l10n-id="paperlink-pref-copy-delete"/>
      <radio value="keep" data-l10n-id="paperlink-pref-copy-keep"/>
    </radiogroup>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="paperlink-pref-notfound"/></label>
    <radiogroup preference="extensions.paperlink.noMatchAction">
      <radio value="move" data-l10n-id="paperlink-pref-nomatch-move"/>
      <radio value="keep" data-l10n-id="paperlink-pref-nomatch-keep"/>
    </radiogroup>
    <checkbox preference="extensions.paperlink.findMissingPDF" data-l10n-id="paperlink-pref-find-missing"/>
    <label data-l10n-id="paperlink-pref-move-target" control="paperlink-move-target"/>
    <hbox align="center">
      <html:input id="paperlink-move-target" type="text" flex="1" style="flex: 1"
                  preference="extensions.paperlink.moveTarget"/>
      <button data-l10n-id="paperlink-pref-browse"
              oncommand="PaperLinkPrefs.browse('paperlink-move-target', false)"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="paperlink-pref-dups"/></label>
    <checkbox preference="extensions.paperlink.checkDuplicates" data-l10n-id="paperlink-pref-dup-check"/>
    <radiogroup preference="extensions.paperlink.duplicateAction">
      <radio value="ask" data-l10n-id="paperlink-pref-dup-ask"/>
      <radio value="merge" data-l10n-id="paperlink-pref-dup-merge"/>
      <radio value="ignore" data-l10n-id="paperlink-pref-dup-ignore"/>
    </radiogroup>
    <checkbox preference="extensions.paperlink.notify" data-l10n-id="paperlink-pref-notify"/>
  </groupbox>
</vbox>
